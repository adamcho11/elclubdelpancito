services:
  - type: web
    name: elclubdelpancito-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npx prisma db push && npm run db:seed && npm start
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://elclubdelpancito.vercel.app
      - key: DATABASE_URL
        value: file:/data/database.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
